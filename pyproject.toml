[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wpack-web-harness"
version = "0.5.1"
description = "ChatGPT-native transport-aware reference and style-family control harness for image generation and editing"
requires-python = ">=3.11"

# The upstream src/zpack package is retained only for provenance during the
# migration. It is not installed or exposed as a command by the web port.
[tool.setuptools]
packages = []
