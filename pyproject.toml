[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zpack-image-harness"
version = "1.2.0"
description = "Public starter harness for rights-cleared image-generation authorities"
requires-python = ">=3.11"

[project.scripts]
zpack = "zpack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
